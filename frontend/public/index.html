            // opened is cleared before it paints; src/index.js then renders the right page.
            // Keep the list of routes in step with KNOWN_ROUTES in src/App.js.
            (function () {
                var root = document.getElementById("root");
                var pre = root.getAttribute("data-prerendered");
                if (!pre) return;
                var path = location.pathname.replace(/\/index\.html$/, "/");
                if (path.length > 1) path = path.replace(/\/+$/, "");
                var known = ["/", "/login", "/cookies", "/fileserver"];
                var belongs = pre === "*" ? known.indexOf(path.toLowerCase()) < 0 : pre === path;
                if (!belongs) {
                    root.textContent = "";
                    root.removeAttribute("data-prerendered");
                }
            })();
