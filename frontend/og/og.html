<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>VeriCase social card</title>
<!-- Rendered to public/og-card.png (1200 x 630) by scripts/render-og.mjs. Built from the site's own
     wordmark, type, colours and opening copy; it shows no product screen, so it claims nothing
     beyond the page it links to. Nothing here is AI-generated. -->
<style>
  @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400 600; src: url('../public/fonts/newsreader-roman.woff2') format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 400; src: url('../public/fonts/newsreader-italic.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../public/fonts/plex-sans-400.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; src: url('../public/fonts/plex-sans-500.woff2') format('woff2'); }
  /* The site's tokens: --vc-ink, --vc-parchment, --vc-parchment-300, --vc-brass-400. */
  :root { --ink: #0B2516; --parchment: #F5F0E6; --parchment-300: #ECE4D3; --brass: #BF9B58; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { position: relative; overflow: hidden; background: var(--ink); color: var(--parchment); font-family: 'IBM Plex Sans', sans-serif; }
  .frame { position: absolute; inset: 40px; border: 1px solid rgb(191 155 88 / 0.35); }
  .logo { position: absolute; left: 88px; top: 82px; height: 50px; }
  .kicker { position: absolute; left: 88px; top: 196px; font-size: 18px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); }
  h1 { position: absolute; left: 88px; top: 236px; font-family: 'Newsreader', serif; font-weight: 500; font-size: 84px; line-height: 1.02; letter-spacing: -0.025em; color: var(--parchment); }
  h1 span, h1 em { display: block; }
  h1 em { font-weight: 400; color: var(--brass); }
  .lead { position: absolute; left: 88px; bottom: 82px; width: 820px; font-family: 'Newsreader', serif; font-style: italic; font-size: 34px; line-height: 1.3; color: var(--brass); }
  .lead em { color: var(--parchment); }
  .url { position: absolute; right: 88px; bottom: 86px; font-size: 20px; font-weight: 500; letter-spacing: 0.02em; color: var(--brass); }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <img class="logo" src="../public/logo-reversed.svg" alt="VeriCase" />
  <p class="kicker">Construction claims and disputes</p>
  <h1><span>Evidence in order.</span> <em>Arguments on the record.</em></h1>
  <p class="lead"><em>“Records, records, VeriCase.”</em> Making Time Your Ally</p>
  <p class="url">veri-case.com</p>
</body>
</html>
