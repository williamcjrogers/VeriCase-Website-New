<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Website Mockup</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      line-height: 1.6;
      background: #f8fafc;
      color: #0f172a;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem; }
    header { padding: 2rem 0; border-bottom: 1px solid #e5e7eb; }
    h1 { font-size: 2rem; margin: 0; }
    main { padding: 2rem 0; }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .card h2 { margin-top: 0; }
    footer { padding: 2rem 0; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: .875rem; }
    a.button { display: inline-block; background: #2563eb; color: white; padding: .75rem 1rem; border-radius: .5rem; text-decoration: none; font-weight: 600; }
    a.button:hover { background: #1d4ed8; }

    @media (prefers-color-scheme: dark) {
      body { background: #0b0f19; color: #e5e7eb; }
      .card { background: #111827; border-color: #1f2937; }
      header, footer { border-color: #1f2937; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Simple Website Mockup</h1>
      <p>A minimal static page replacing the previous app.</p>
    </header>

    <main>
      <div class="card">
        <h2>Welcome</h2>
        <p>This is a lightweight HTML-only mockup. Customize this content as needed.</p>
        <p><a class="button" href="#">Primary Action</a></p>
      </div>
    </main>

    <footer>
      <p>© 2025 Your Project</p>
    </footer>
  </div>
</body>
</html>
