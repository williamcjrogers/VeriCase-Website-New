<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="vcTickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <symbol id="VeriCaseLogo" viewBox="0 0 900 200" preserveAspectRatio="xMinYMid meet">
      <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
         font-weight="800" font-size="150" fill="#1E293B">
        <text x="0" y="145" letter-spacing="0">VeriCase</text>
      </g>
      <path d="M 75 60 C 110 20, 150 5, 185 5 C 210 5, 225 15, 240 30"
            fill="none" stroke="url(#vcTickGrad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="VeriCaseLogoLight" viewBox="0 0 900 200" preserveAspectRatio="xMinYMid meet">
      <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
         font-weight="800" font-size="150" fill="#FFFFFF">
        <text x="0" y="145" letter-spacing="0">VeriCase</text>
      </g>
      <path d="M 75 60 C 110 20, 150 5, 185 5 C 210 5, 225 15, 240 30"
            fill="none" stroke="url(#vcTickGrad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <defs>
    <style>
      .text { font-family: 'Inter', sans-serif; }
      .section-header { font-size: 16px; font-weight: bold; fill: #0D9488; text-transform: uppercase; letter-spacing: 1px; }
      .title { font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .description { font-size: 20px; fill: #CBD5E1; line-height: 1.6; }
      .highlight { font-weight: bold; fill: #FFFFFF; }
      .cta-button-light { fill: #FFFFFF; rx: 5; ry: 5; }
      .cta-text-dark { font-size: 16px; font-weight: bold; fill: #1E293B; text-anchor: middle; }
      .gantt-bg { fill: #FFFFFF; rx: 8; stroke: #E2E8F0; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
      .gantt-header { font-size: 14px; font-weight: bold; fill: #1E293B; }
      .gantt-task { font-size: 14px; fill: #64748B; }
      .gantt-bar { rx: 3; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#1E293B"/>

  <g transform="translate(50, 100)" class="text">
    <text x="0" y="0" class="section-header">Specialized Tools</text>
    <text x="0" y="50" class="title">The Construction Add-In:</text>
    <text x="0" y="95" class="title">Programme Awareness.</text>

    <text x="0" y="180" class="description">
      <tspan x="0" dy="0">Construction claims require more than just email</tspan>
      <tspan x="0" dy="1.6em">review. VeriCase integrates directly with your</tspan>
      <tspan x="0" dy="1.6em">project schedule (Primavera/MS Project).</tspan>
    </text>
    
    <text x="0" y="320" class="description">
        <tspan x="0" dy="0" class="highlight">• Link Evidence to Baseline Activities</tspan>
        <tspan x="0" dy="1.6em" class="highlight">• Tag and Categorize Delay Events</tspan>
        <tspan x="0" dy="1.6em" class="highlight">• Visualize Impacts on the Critical Path</tspan>
    </text>

    <g transform="translate(0, 450)">
      <rect x="0" y="0" width="280" height="50" class="cta-button-light"/>
      <text x="140" y="32" class="cta-text-dark">Explore the Construction Add-In</text>
    </g>
  </g>

  <g transform="translate(550, 100)">
    <rect width="600" height="400" class="gantt-bg"/>
    
    <text x="30" y="40" class="gantt-header">Project Schedule (Baseline vs Actual)</text>
    <text x="250" y="40" class="gantt-header">Jan</text>
    <text x="350" y="40" class="gantt-header">Feb</text>
    <text x="450" y="40" class="gantt-header">Mar</text>

    <line x1="30" y1="60" x2="570" y2="60" stroke="#E2E8F0"/>

    <g transform="translate(0, 80)">
        <text x="30" y="15" class="gantt-task">A101: Site Preparation</text>
        <rect x="250" y="5" width="50" height="25" class="gantt-bar" fill="#64748B"/>
    </g>
    <g transform="translate(0, 130)">
        <text x="30" y="15" class="gantt-task">A102: Foundation Excavation</text>
        <rect x="300" y="5" width="80" height="25" class="gantt-bar" fill="#64748B"/>
        <rect x="300" y="35" width="120" height="25" class="gantt-bar" fill="#0D9488" opacity="0.7"/>
    </g>
     <g transform="translate(0, 190)">
        <text x="30" y="15" class="gantt-task">A103: Concrete Pour</text>
        <rect x="380" y="5" width="40" height="25" class="gantt-bar" fill="#64748B"/>
    </g>

    <g transform="translate(30, 250)">
        <text x="0" y="15" class="gantt-header">Linked Evidence for A102 (Excavation Delay)</text>
        <line x1="0" y1="30" x2="540" y2="30" stroke="#E2E8F0"/>
        
        <g transform="translate(0, 40)">
            <rect x="0" y="0" width="540" height="40" fill="#F1F5F9" rx="3"/>
            <text x="10" y="25" class="gantt-task" style="fill: #1E293B;">Email: "Unforeseen ground conditions encountered." (J.Smith, Feb 15)</text>
             <text x="420" y="25" class="gantt-task" style="fill: #0D9488; font-weight: bold;">[Delay Tag: Site Conditions]</text>
        </g>
        <g transform="translate(0, 90)">
            <rect x="0" y="0" width="540" height="40" fill="#F1F5F9" rx="3"/>
            <text x="10" y="25" class="gantt-task" style="fill: #1E293B;">Report: Daily Log - Feb 16 (Equipment Failure)</text>
             <text x="420" y="25" class="gantt-task" style="fill: #0D9488; font-weight: bold;">[Delay Tag: Internal]</text>
        </g>
    </g>

    <path d="M 400 170 Q 300 180, 200 260" stroke="#0D9488" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
    <polygon points="195,260 205,260 200,252" fill="#0D9488"/>

  </g>

<use href="#VeriCaseLogoLight" transform="translate(50,30)" width="320" />
</svg>