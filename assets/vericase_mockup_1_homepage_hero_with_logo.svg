<svg width="1200" height="650" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="vcTickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <symbol id="VeriCaseLogo" viewBox="0 0 900 200" preserveAspectRatio="xMinYMid meet">
      <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
         font-weight="800" font-size="150" fill="#1E293B">
        <text x="0" y="145" letter-spacing="0">VeriCase</text>
      </g>
      <path d="M 75 60 C 110 20, 150 5, 185 5 C 210 5, 225 15, 240 30"
            fill="none" stroke="url(#vcTickGrad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="VeriCaseLogoLight" viewBox="0 0 900 200" preserveAspectRatio="xMinYMid meet">
      <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif"
         font-weight="800" font-size="150" fill="#FFFFFF">
        <text x="0" y="145" letter-spacing="0">VeriCase</text>
      </g>
      <path d="M 75 60 C 110 20, 150 5, 185 5 C 210 5, 225 15, 240 30"
            fill="none" stroke="url(#vcTickGrad)" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <defs>
    <style>
      .text { font-family: 'Inter', sans-serif; }
      .logo-text { font-size: 24px; font-weight: bold; fill: #1E293B; }
      .nav-link { font-size: 16px; fill: #64748B; cursor: pointer; }
      .headline { font-size: 64px; font-weight: 800; fill: #1E293B; line-height: 1.2; }
      .subheadline { font-size: 20px; fill: #64748B; line-height: 1.5; }
      .cta-button { fill: #0D9488; rx: 5; ry: 5; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      .cta-text { font-size: 18px; font-weight: bold; fill: white; text-anchor: middle; }
    </style>
    <linearGradient id="bgGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>
      <pattern id="bg-dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradHero)"/>
  <rect width="100%" height="100%" fill="url(#bg-dots)" opacity="0.6"/>

  <g transform="translate(50, 40)" class="text">
    <g transform="scale(0.9)">
        <circle cx="5" cy="15" r="5" fill="#0D9488"/>
        <circle cx="17" cy="8" r="5" fill="#0D9488"/>
        <circle cx="29" cy="1" r="5" fill="#0D9488"/>
        <path d="M 5 15 L 29 1 L 45 30" stroke="#0D9488" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="55" y="22" class="logo-text">VeriCase</text>

    <text x="700" y="22" class="nav-link">Platform</text>
    <text x="800" y="22" class="nav-link">Construction Focus</text>
    <text x="950" y="22" class="nav-link">Pricing</text>
     <rect x="1030" y="2" width="120" height="40" class="cta-button"/>
    <text x="1090" y="27" class="cta-text" style="font-size: 16px;">Get Demo</text>
  </g>

  <g transform="translate(50, 160)" class="text">
    <text x="0" y="0" class="headline">Make Time Your Ally,</text>
    <text x="0" y="80" class="headline">Not Your Enemy.</text>
   
    <text x="0" y="180" class="subheadline">
      <tspan x="0" dy="0">Construction and commercial disputes live in email. VeriCase</tspan>
      <tspan x="0" dy="1.5em">is the only platform that reconstructs complex PST data into</tspan>
      <tspan x="0" dy="1.5em">a single, forensic, message-level chronology.</tspan>
    </text>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="220" height="55" class="cta-button"/>
      <text x="110" y="35" class="cta-text">See VeriCase in Action</text>
    </g>
  </g>

  <g transform="translate(680, 150)">
    <rect width="450" height="350" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
    
     <g transform="translate(40, 40)" opacity="0.6">
             <text x="0" y="0" style="font-family: 'Inter'; font-size: 16px; font-weight: bold; fill: #1E293B;">Fragmented PST Data</text>
            <circle cx="10" cy="40" r="5" fill="#1E293B"/>
            <circle cx="40" cy="70" r="5" fill="#0D9488"/>
            <circle cx="5" cy="110" r="5" fill="#1E293B"/>
            <circle cx="50" cy="140" r="5" fill="#64748B"/>
            <circle cx="25" cy="180" r="5" fill="#0D9488"/>
             <circle cx="60" cy="30" r="5" fill="#64748B"/>
             <circle cx="80" cy="90" r="5" fill="#1E293B"/>
             <circle cx="70" cy="200" r="5" fill="#1E293B"/>
        </g>

        <path d="M 140 175 H 190" stroke="#0D9488" stroke-width="3" stroke-dasharray="5,5"/>
        <path d="M 190 175 L 180 170 M 190 175 L 180 180" stroke="#0D9488" stroke-width="3" fill="none"/>

        <g transform="translate(220, 40)">
             <text x="0" y="0" style="font-family: 'Inter'; font-size: 16px; font-weight: bold; fill: #1E293B;">The Chronology Lens™</text>
            <line x1="20" y1="30" x2="20" y2="280" stroke="#1E293B" stroke-width="3"/>
            <g transform="translate(0, 50)">
                <circle cx="20" cy="0" r="6" fill="#0D9488"/>
                <rect x="40" y="-10" width="120" height="20" fill="#F1F5F9" rx="3"/>
            </g>
            <g transform="translate(0, 90)">
                <circle cx="20" cy="0" r="6" fill="#0D9488"/>
                 <rect x="40" y="-10" width="100" height="20" fill="#F1F5F9" rx="3"/>
            </g>
             <g transform="translate(0, 130)">
                <circle cx="20" cy="0" r="6" fill="#0D9488"/>
                 <rect x="40" y="-10" width="140" height="20" fill="#F1F5F9" rx="3"/>
            </g>
            <g transform="translate(0, 170)">
                <circle cx="20" cy="0" r="6" fill="#0D9488"/>
                 <rect x="40" y="-10" width="110" height="20" fill="#F1F5F9" rx="3"/>
            </g>
             <g transform="translate(0, 210)">
                <circle cx="20" cy="0" r="6" fill="#0D9488"/>
                 <rect x="40" y="-10" width="130" height="20" fill="#F1F5F9" rx="3"/>
            </g>
        </g>
  </g>

<use href="#VeriCaseLogo" transform="translate(50,10)" width="280" />
</svg>